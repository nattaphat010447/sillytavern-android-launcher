name: Release APK

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install zstandard

      - name: Download & stage native libraries
        run: python scripts/setup-native-libs.py

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/standroid-release.jks

      - name: Build release APKs
        env:
          RELEASE_KEYSTORE_PATH: /tmp/standroid-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK artifacts
        run: |
          mkdir -p dist
          # ABI-specific APKs
          find app/build/outputs/apk/release -name "*.apk" | while read f; do
            base=$(basename "$f" .apk)
            cp "$f" "dist/${base}-${{ github.ref_name }}.apk"
          done
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "STANDROID ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*.apk
