# Gradle JVM args
# 3GB heap is a balance: enough for R8 minification but leaves
# native address space for compressed-oops + native allocations on
# 16GB Windows machines (4GB caused native malloc OOM during shrinkRelease).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Build performance / memory tuning
org.gradle.parallel=false
org.gradle.workers.max=2

# AndroidX
android.useAndroidX=true

# Kotlin code style: "official" or "obsolete"
kotlin.code.style=official

# Reduces R class bloat (non-transitive R classes)
android.nonTransitiveRClass=true

# Enable configuration cache (speeds up incremental builds)
org.gradle.configuration-cache=true